<main class="group-container">
    <div class="group-information-header">
        <h1 id="group-name">Loading…</h1>
        <p id="group-desc" class="group-description"></p>
        <p id="invite-code-container">Invite code: <span id="invite-code"></span></p>
        <div class="group-information-actions">
            <button class="btn-view-challenges" data-id="" id="group-challenges">Challenges</button>
            <button class="btn-view-habits" data-id="" id="group-habits">Habits</button>
        </div>
    </div>

    <div class="podium">
        <div class="podium-item second">
            <div class="star">★</div>
            <div class="user-name"></div>
            <div class="points"></div>
        </div>
        <div class="podium-item first">
            <div class="star">★</div>
            <div class="user-name"></div>
            <div class="points"></div>
        </div>
        <div class="podium-item third">
            <div class="star">★</div>
            <div class="user-name"></div>
            <div class="points"></div>
        </div>
    </div>

    <div class="member-flex">
        <div class="members-list">
            <h2>Members</h2>
            <ul id="members-list"></ul>
        </div>
        <div class="member-chart">
            <h2 id="member-chart-title">Select a member</h2>
            <p id="member-instruction">
                Click on a member from the list to view their contribution percentage.
            </p>
            <canvas id="memberPieChart"></canvas>
        </div>
    </div>

    <div class="history-controls">
        <label for="range-select">Show:</label>
        <select id="range-select">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
        </select>
    </div>

    <div class="group-information-chart-container">
        <canvas id="pointsHistoryChart"></canvas>
    </div>
</main>
