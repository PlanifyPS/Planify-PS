<body>

<main id="challenges">
    <div class="challenges-header">
        <h1><i class="fas fa-trophy"></i> Weekly Challenges</h1>
        <div class="challenges-controls">
            <div class="search-filter">
                <div class="search-box">
                    <input type="text" id="search-challenges" placeholder="Search challenge...">
                </div>
                <select id="filter-challenges">
                    <option value="all">All</option>
                    <option value="completed">Completed</option>
                    <option value="in-progress">In progress</option>
                    <option value="pending">Pending</option>
                </select>
                <select id="filter-level">
                    <option value="all">All levels</option>
                    <option value="fácil">Easy</option>
                    <option value="medio">Medium</option>
                    <option value="difícil">Hard</option>
                </select>
            </div>
        </div>
    </div>

    <div id="challenge-layout">
        <div id="cards-container" class="cards-grid">
        </div>

        <div id="challenge-detail" class="detail-card" style="display: none;">
        </div>
    </div>
</main>

<script type="module" src="js/groupchallenge.js"></script>

</body>
