<main id="group-challenges">
  <div class="challenges-header">
    <h1><i class="fas fa-people-group"></i> Group Challenges</h1>
    <div class="challenges-controls">
      <div class="search-filter">
        <div class="search-box">
          <input type="text" id="search-group-challenges" placeholder="Search group challenge...">
        </div>
        <select id="filter-group-challenges">
          <option value="all">All</option>
          <option value="joined">Joined</option>
          <option value="open">Open</option>
          <option value="completed">Completed</option>
        </select>
        <select id="filter-group-level">
          <option value="all">All levels</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>
  </div>
  <div id="group-challenge-layout">
    <div id="group-cards-container" class="cards-grid">
    </div>

    <div id="group-challenge-detail" class="detail-card-group">
      <div class="empty-detail-group">
        <i class="fas fa-people-arrows"></i>
        <h2>Select a Group Challenge</h2>
        <p>Click on any group challenge to see its details and join!</p>
      </div>
    </div>
  </div>
</main>
