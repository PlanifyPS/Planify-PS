<main class="contenderforo">
  <header>
    <h1 id="forumName">Forum Name</h1>
    <div class="foro-search">
      <input type="text" id="searchForum" placeholder="Search Forum...">
      <button id="searchButton">Search</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </header>
  <div class="container">
    <main>
      <button id="createForum">Create Forum</button>
      <button id="addPost">Add</button>
      <section id="forumContainer">
      </section>
    </main>
    <aside class="interest-forum">
      <h2>Forums of interest</h2>
      <ul id="forumList"></ul>
    </aside>
  </div>

  <div id="postModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Crear Nuevo Post</h2>
      <input type="text" id="postTitle" placeholder="Affair">
      <textarea id="postContent" placeholder="Write your message..."></textarea>
      <button id="savePost">Save</button>
    </div>
  </div>

  <div id="forumModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Create New Forum</h2>
      <input type="text" id="forumTitle" placeholder="Forum Name">
      <button id="saveForum">Save</button>
    </div>
  </div>

  <template id="postTemplate">
    <article class="post">
      <h3 class="post-title"></h3>
      <p class="post-content"></p>
      <div class="post-footer">
        <div class="user-info">
          <img src="user.png" alt="User" class="user-photo">
          <span class="user-name">Demo User</span>
        </div>
        <span class="post-date"></span>
      </div>
    </article>
  </template>
</main>
