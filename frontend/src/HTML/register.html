<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Log In</title>
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body id="register">
<div class="container right-panel-active">
  <!-- Formulario de Registro -->
  <div class="container__form container--signup">
    <form action="#" class="form" id="signup-form">
      <h2 class="form__title">Sign Up</h2>
      <input type="text" id="signup-username" placeholder="User" class="input" />
      <input type="email" id="signup-email" placeholder="Email" class="input" />
      <input type="password" id="signup-password" placeholder="Password" class="input" />
      <input type="password" id="signup-repeat-password" placeholder="Repeat Password" class="input" />
      <button type="submit" class="btn">Sign Up</button>
    </form>
  </div>

  <!-- Formulario de Inicio de Sesión -->
  <div class="container__form container--login">
    <form action="#" class="form" id="login-form">
      <h2 class="form__title">Log In</h2>
      <input type="email" id="login-email" placeholder="Email" class="input" />
      <input type="password" id="login-password" placeholder="Password" class="input" />
      <a href="#" class="link">Forgot your password?</a>
      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>

  <!-- Overlay para cambiar entre formularios -->
  <div class="container__overlay">
    <div class="overlay">
      <div class="overlay__panel overlay--left">
        <button class="btn" id="logIn">Log In</button>
      </div>
      <div class="overlay__panel overlay--right">
        <button class="btn" id="signUp">Sign Up</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="../JS/app.js"></script>
<script type="module" src="../JS/register.js"></script>
</body>
</html>
